<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Network Proxy — 三层代理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0b0d12; color:#c0caf5; font-family:system-ui,sans-serif; padding:16px; font-size:14px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:#7d8590; margin-bottom:20px; font-size:13px; }
  .card { background:#131722; border:1px solid #2a2f3a; border-radius:6px; padding:16px; margin-bottom:12px; }
  .card h2 { font-size:14px; color:#7aa2f7; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.05em; }
  label { display:block; margin-bottom:4px; color:#7d8590; font-size:12px; }
  input, select, textarea { width:100%; background:#0b0d12; border:1px solid #2a2f3a; color:#c0caf5; padding:8px 10px; border-radius:4px; font-family:inherit; font-size:13px; margin-bottom:10px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#7aa2f7; }
  textarea { resize:vertical; min-height:80px; font-family:ui-monospace,monospace; }
  button { background:#7aa2f7; color:#0b0d12; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:500; font-size:13px; }
  button:hover { opacity:0.9; }
  button.ghost { background:transparent; color:#c0caf5; border:1px solid #2a2f3a; }
  button.danger { background:#f7768e; }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row > * { flex:1; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #2a2f3a; }
  th { color:#7d8590; font-weight:500; font-size:12px; text-transform:uppercase; }
  pre { background:#0b0d12; border:1px solid #2a2f3a; border-radius:4px; padding:12px; overflow:auto; font-family:ui-monospace,monospace; font-size:12px; color:#9ece6a; }
  .status-ok { color:#9ece6a; }
  .status-err { color:#f7768e; }
  .tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid #2a2f3a; }
  .tabs button { background:transparent; color:#7d8590; border:none; padding:10px 14px; border-radius:0; border-bottom:2px solid transparent; font-weight:500; }
  .tabs button.active { color:#7aa2f7; border-bottom-color:#7aa2f7; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .checkbox-row input { width:auto; margin:0; }
  .checkbox-row label { margin:0; color:#c0caf5; font-size:13px; }
  .hint { color:#7d8590; font-size:12px; margin-top:-6px; margin-bottom:10px; }
</style>
</head>
<body>
  <h1>Network Proxy — 三层代理</h1>
  <div class="sub">网络代理配置 — 全局 → 策略组 → 节点 / 模型，按优先级生效。</div>

  <div class="card">
    <h2>Level</h2>
    <div class="tabs" id="levelTabs">
      <button type="button" data-level="global" class="active">Global</button>
      <button type="button" data-level="strategy">Strategy</button>
      <button type="button" data-level="node">Node</button>
      <button type="button" data-level="model">Model</button>
    </div>

    <form id="proxyForm">
      <label for="keyInput" id="keyLabel">Key</label>
      <input id="keyInput" type="text" placeholder="例如：strategy-default / node-id / model-name" />
      <div class="hint" id="keyHint">Global 级别可留空（使用 __global__）。</div>

      <div class="row">
        <div>
          <label for="protocol">Protocol</label>
          <select id="protocol">
            <option value="http">http</option>
            <option value="https">https</option>
            <option value="socks5">socks5</option>
          </select>
        </div>
        <div>
          <label for="host">Host</label>
          <input id="host" type="text" placeholder="127.0.0.1" required />
        </div>
        <div>
          <label for="port">Port</label>
          <input id="port" type="number" min="1" max="65535" placeholder="7890" required />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="authUser">Auth Username (optional)</label>
          <input id="authUser" type="text" />
        </div>
        <div>
          <label for="authPass">Auth Password (optional)</label>
          <input id="authPass" type="password" />
        </div>
      </div>

      <div class="checkbox-row">
        <input id="enabled" type="checkbox" checked />
        <label for="enabled">Enabled</label>
      </div>

      <button type="submit">Save proxy</button>
    </form>
    <pre id="setResult" style="margin-top:12px; display:none;"></pre>
  </div>

  <div class="card">
    <h2>Test Resolve</h2>
    <label>调用 resolve 与 getProxyUrl，查看当前上下文的有效代理。</label>
    <div class="row">
      <button type="button" id="resolveBtn">Resolve effective proxy</button>
      <button type="button" id="getUrlBtn" class="ghost">Get proxy URL</button>
    </div>
    <pre id="resolveResult" style="margin-top:12px; display:none;"></pre>
  </div>

<script>
  const PLUGIN_NAME = 'network-proxy'

  async function invoke(handler, params) {
    const res = await fetch(`/api/admin/plugins/${PLUGIN_NAME}/invoke`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handler, params })
    })
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`)
    return res.json()
  }

  function show(panelId, content, ok = true) {
    const el = document.getElementById(panelId)
    el.style.display = 'block'
    el.className = ok ? 'status-ok' : 'status-err'
    el.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2)
  }

  let currentLevel = 'global'
  const tabs = document.querySelectorAll('#levelTabs button')
  tabs.forEach(b => {
    b.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'))
      b.classList.add('active')
      currentLevel = b.dataset.level
      const hint = document.getElementById('keyHint')
      const keyInput = document.getElementById('keyInput')
      switch (currentLevel) {
        case 'global':
          hint.textContent = 'Global 级别可留空（使用 __global__）。'
          keyInput.placeholder = '可留空'
          break
        case 'strategy':
          hint.textContent = '填写策略组名称。'
          keyInput.placeholder = 'strategy-default'
          break
        case 'node':
          hint.textContent = '填写节点 ID。'
          keyInput.placeholder = 'node-id'
          break
        case 'model':
          hint.textContent = '填写模型名称。'
          keyInput.placeholder = 'gpt-4o'
          break
      }
    })
  })

  document.getElementById('proxyForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    try {
      const host = document.getElementById('host').value.trim()
      const port = parseInt(document.getElementById('port').value, 10)
      const protocol = document.getElementById('protocol').value
      const authUser = document.getElementById('authUser').value.trim()
      const authPass = document.getElementById('authPass').value
      const enabled = document.getElementById('enabled').checked
      const key = document.getElementById('keyInput').value.trim() || undefined

      const config = { enabled, protocol, host, port }
      if (authUser) config.auth = { username: authUser, password: authPass }

      const result = await invoke('set', { level: currentLevel, key, config })
      show('setResult', `Saved [${currentLevel}] ${key ?? '(default)'}\n\n` + JSON.stringify(result, null, 2), true)
    } catch (err) {
      show('setResult', String(err), false)
    }
  })

  document.getElementById('resolveBtn').addEventListener('click', async () => {
    try {
      const result = await invoke('resolve', {})
      show('resolveResult', result, true)
    } catch (err) {
      show('resolveResult', String(err), false)
    }
  })

  document.getElementById('getUrlBtn').addEventListener('click', async () => {
    try {
      const result = await invoke('getProxyUrl', {})
      const url = result?.output?.content ?? result?.ctx?.output?.content
      show('resolveResult', url ? `Proxy URL: ${url}\n\n` + JSON.stringify(result, null, 2) : JSON.stringify(result, null, 2), true)
    } catch (err) {
      show('resolveResult', String(err), false)
    }
  })
</script>
</body>
</html>
